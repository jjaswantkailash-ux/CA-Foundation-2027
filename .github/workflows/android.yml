
name: Build CA Foundation APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CAFoundation2027-Android-Project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q CAFoundation2027-Android-Project.zip -d source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd source/CAFoundation2027
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CA-Foundation-2027-APK
          path: source/CAFoundation2027/app/build/outputs/apk/debug/app-debug.apk
          
